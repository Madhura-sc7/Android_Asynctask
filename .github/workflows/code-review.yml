name: Claude PR Review   # shown in the GitHub Actions tab

# Only listens for comments (not every push/commit) — keeps API usage low
on:
  issue_comment:
    types: [created]   # fires when any comment is posted on an issue or PR

# If /review is commented twice quickly, cancel the older run instead of
# running both — avoids wasting credits on duplicate reviews
concurrency:
  group: claude-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Job only runs if: comment is on a PR AND comment text contains "/review"
    # Without this check, EVERY comment on EVERY issue would trigger a run
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/review')
    runs-on: ubuntu-latest   # Linux runner provided by GitHub

    permissions:
      contents: read          # needed to check out repo code
      pull-requests: write    # needed to comment on the PR
      issues: write           # PR comments use the issues API internally
      statuses: write         # needed to set the pass/fail check on the PR
      id-token: write         # required by claude-code-base-action for auth

    steps:
      # STEP 1: issue_comment events don't include PR branch/commit info,
      # so we fetch the PR manually to get its head SHA and branch name
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.issue.number
            });
            core.setOutput('sha', pr.data.head.sha);   // commit hash — used for status check
            core.setOutput('ref', pr.data.head.ref);   // branch name — used to checkout code

      # STEP 2: download the actual PR code onto the runner
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}   # checkout the PR's branch, not main
          fetch-depth: 0                      # full git history, needed to diff changes

      # STEP 3: send the code diff to Claude API with our review rules
      - name: Run Claude review
        id: run_claude
        uses: anthropics/claude-code-base-action@v1   # official Anthropic action
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}   # secret set in repo settings
          allowed_tools: "Read,Bash(git diff:*)"   # read-only — Claude can't edit/commit code
          max_turns: 3        # caps how many tool calls Claude can make — limits token cost
          timeout_minutes: 5  # hard stop so a stuck run doesn't burn credits endlessly
          prompt: |
            You are an Android Java code reviewer. Review ONLY changed files (use git diff).
            Check: PascalCase for classes/methods/fields/constants; camelCase for local vars/params.
            Also check: nulls, exceptions, lifecycle/context misuse, unused code, leaks, security.
            Ignore formatting-only changes, build/, .gradle/.
            For each issue: **File:**, **Line:**, **Problem:**, **Recommendation:**, **Code:**.
            If nothing found, reply ONLY: No issues found. Looks good to merge.

      # STEP 4: Claude's action outputs a raw JSON log, not plain text.
      # This step digs into that log and pulls out Claude's final written review.
      - name: Extract review
        id: extract_review
        if: always()   # run even if step 3 failed, so we still know something went wrong
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = "No review content returned - check workflow logs.";
            try {
              const file = '${{ steps.run_claude.outputs.execution_file }}';
              if (file && fs.existsSync(file)) {
                const log = JSON.parse(fs.readFileSync(file, 'utf8'));
                // search from the end — the LAST "result" entry is Claude's final answer
                for (let i = log.length - 1; i >= 0; i--) {
                  if (log[i]?.type === 'result' && typeof log[i].result === 'string') {
                    output = log[i].result; break;
                  }
                }
              }
            } catch (e) { core.warning(e.message); }
            core.setOutput('final_message', output);   // pass this text to the next steps

      # STEP 5: post the review text as a PR comment, and set a green/red
      # status check on the PR (this is what merge-blocking rules can require)
      - name: Post comment + set status
        if: always()
        uses: actions/github-script@v7
        env:
          CLAUDE_OUTPUT: ${{ steps.extract_review.outputs.final_message }}
        with:
          script: |
            const output = process.env.CLAUDE_OUTPUT;
            const noIssues = output.toLowerCase().includes("no issues found");   // check Claude's verdict
            const body = "## Claude Android Review\n" +
              (noIssues ? "✅ No issues found." : "❌ Issues found — fix before merging.") +
              "\n\n" + output;

            // post the review as a normal PR comment
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.issue.number, body
            });

            // set a status check on the commit — shows up as pass/fail on the PR
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: '${{ steps.pr.outputs.sha }}',
              state: noIssues ? 'success' : 'failure',
              context: 'Claude Android Review'
            });

      # STEP 6: also fail this GitHub Actions job itself if issues were found,
      # so it shows red/green directly in the Actions tab (separate from the status check above)
      - name: Fail job if issues found
        if: always()
        env:
          CLAUDE_OUTPUT: ${{ steps.extract_review.outputs.final_message }}
        run: echo "$CLAUDE_OUTPUT" | grep -qi "No issues found"   # exits 1 (fail) if text isn't found
