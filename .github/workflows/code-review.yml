name: Codex PR Review   # name shown in the Actions tab

on:
  pull_request:
    types: [opened, synchronize, reopened]   # run on new PRs, new commits, and reopened PRs

jobs:
  codex-review:
    runs-on: ubuntu-latest   # Linux runner

    permissions:
      contents: read          # read repo code
      pull-requests: write    # allow posting PR comments
      issues: write           # PR comments use issues API internally

    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}   # pass Codex's result to later steps

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # download repo code onto runner
        with:
          fetch-depth: 0            # get full history to diff PR changes

      - name: Run Codex Android Code Review
        id: run_codex                    # id to reference this step's output later
        uses: openai/codex-action@v1     # official Codex action
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}   # API key from repo secrets
          prompt: |
            You are an experienced Android Java code reviewer.
            Review ONLY the files changed in this pull request.

            1) NAMING CONVENTIONS — check against this exact rule table:
               PASCAL CASE (PascalCase) must be used for:
               - Class names
               - Function or Method names
               - Interface names
               - Global Variable names
               - Field names
               - Enumeration names
               - Exception Class names
               - Constants

               CAMEL CASE (camelCase) must be used for:
               - Local Variables
               - Parameters
               - Property names
               - Block Level Variables
               - Method Level Variables

            2) CODE QUALITY — also check for:
               - Clean, readable, and maintainable code
               - Null pointer risks and missing exception handling
               - Android best practices (Activity/Fragment lifecycle, Context usage, UI thread)
               - Unused imports, variables, methods, and duplicate code
               - Performance issues
               - Resource leaks and memory leaks
               - Security issues (hardcoded secrets or sensitive data)

            Ignore:
            - Formatting-only changes
            - Auto-generated files
            - build/
            - .gradle/

            For EACH issue found (naming OR code quality), reply in this exact format:
            - **File:** <filename>
              **Line:** <line number>
              **Problem:** <what rule/best practice was violated>
              **Recommendation:** <how to fix it>
              **Code:** `<exact problematic line of code>`

            If there are NO issues at all, reply ONLY with:
            No issues found. Looks good to merge.

      - name: Post Codex review as PR comment
        if: always()                      # run even if Codex step failed
        uses: actions/github-script@v7    # runs JS to call GitHub's API
        env:
          CODEX_OUTPUT: ${{ steps.run_codex.outputs.final-message }}   # bring Codex's output into the script
        with:
          script: |
            // fallback text if Codex gave nothing
            const output = process.env.CODEX_OUTPUT || "No review content returned. Codex step may have failed - check the workflow logs.";
            const author = context.payload.pull_request.user.login;

            // true if Codex said everything is clean
            const noIssues = output.toLowerCase().includes("no issues found");

            const statusIcon = noIssues ? "✅" : "❌";
            const statusText = noIssues
              ? "Good to merge — no issues found."
              : "Blocked — issues found. Please fix before merging.";

            // plain string building (not template literal) so backticks in output don't break this script
            const body = "## Codex Android Review\n" +
              "**Status:** " + statusIcon + " " + statusText + "\n\n" +
              output + "\n\n" +
              "@" + author + " Review complete.";

            // post the comment on the PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

      - name: Block merge if issues were found
        if: always()                      # run even if earlier steps failed
        env:
          CODEX_OUTPUT: ${{ steps.run_codex.outputs.final-message }}
        run: |
          output="$CODEX_OUTPUT"
          # pass the check only if Codex explicitly said no issues
          if echo "$output" | grep -qi "No issues found"; then
            echo "✅ No issues found. Good to merge."
            exit 0
          else
            # fail the check — blocks merge if this check is marked "Required"
            echo "❌ Issues found (or the review step failed). Blocking merge."
            exit 1
          fi
