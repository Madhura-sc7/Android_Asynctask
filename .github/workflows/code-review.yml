name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  codex-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Codex Android Code Review
        id: run_codex
        uses: openai/codex-action@v1   # consider pinning to a specific release/commit SHA for security
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            You are an experienced Android Java code reviewer.
            Review ONLY the files changed in this pull request.
            Check for:
            - Java coding standards and naming conventions
            - Clean, readable, and maintainable code
            - Null pointer risks and exception handling
            - Android best practices (Activity/Fragment lifecycle, Context usage, UI thread)
            - Unused imports, variables, methods, and duplicate code
            - Performance issues
            - Resource leaks and memory leaks
            - Security issues (hardcoded secrets or sensitive data)
            Ignore:
            - Formatting-only changes
            - Auto-generated files
            - build/
            - .gradle/
            For EACH issue found, reply in this exact format:
            - **Severity:** Critical | High | Medium | Low
              **File:** <filename>
              **Line:** <line number>
              **Problem:** <one-line description>
              **Recommendation:** <how to fix it>
              **Code:** `<exact problematic line of code>`
            If there are NO issues, reply ONLY with:
            No issues found. Looks good to merge.

      - name: Post Codex review as PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          CODEX_OUTPUT: ${{ steps.run_codex.outputs.final-message }}
        with:
          script: |
            const output = process.env.CODEX_OUTPUT || "No review content returned. Codex step may have failed - check the workflow logs.";
            const author = context.payload.pull_request.user.login;
            const noIssues = output.toLowerCase().includes("no issues found");
            const statusIcon = noIssues ? "✅" : "⚠️";
            const statusText = noIssues ? "No issues found" : "Issues found - please review";

            const body = "## Codex Android Review\n" +
              "**Status:** " + statusIcon + " " + statusText + "\n\n" +
              output + "\n\n" +
              "@" + author + " Review complete.";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

      - name: Fail check if issues were found
        if: always()
        env:
          CODEX_OUTPUT: ${{ steps.run_codex.outputs.final-message }}
        run: |
          output="$CODEX_OUTPUT"
          if echo "$output" | grep -qi "No issues found"; then
            echo "No issues found. Check passed."
            exit 0
          else
            echo "Issues were found by Codex, or the review step failed. Failing the workflow."
            exit 1
          fi
