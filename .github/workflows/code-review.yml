name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  codex-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Codex Android Code Review
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            You are an experienced Android Java code reviewer.
            Review ONLY the files changed in this pull request.
            Check ONLY naming convention compliance based on this rule table:

            PASCAL CASE (PascalCase) must be used for:
            - Class names
            - Function or Method names
            - Interface names
            - Global Variable names
            - Field names
            - Enumeration names
            - Exception Class names
            - Constants

            CAMEL CASE (camelCase) must be used for:
            - Local Variables
            - Parameters
            - Property names
            - Block Level Variables
            - Method Level Variables

            Ignore:
            - Formatting-only changes
            - Auto-generated files
            - build/
            - .gradle/

            For EACH naming violation found, reply in this exact format:
            - **Severity:** Critical | High | Medium | Low
              **File:** <filename>
              **Line:** <line number>
              **Problem:** <which rule was violated, e.g. "Method name not in PascalCase">
              **Recommendation:** <corrected name following the rule>
              **Code:** `<exact problematic line of code>`

            If there are NO naming violations, reply ONLY with:
            No issues found. Looks good to merge.

      - name: Post Codex review as PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          CODEX_OUTPUT: ${{ steps.run_codex.outputs.final-message }}
        with:
          script: |
            const output = process.env.CODEX_OUTPUT || "No review content returned. Codex step may have failed - check the workflow logs.";
            const author = context.payload.pull_request.user.login;
            const noIssues = output.toLowerCase().includes("no issues found");

            const statusIcon = noIssues ? "✅" : "❌";
            const statusText = noIssues
              ? "Good to merge — no naming convention issues found."
              : "Blocked — naming convention issues found. Please fix before merging.";

            const body = "## Codex Android Review\n" +
              "**Status:** " + statusIcon + " " + statusText + "\n\n" +
              output + "\n\n" +
              "@" + author + " Review complete.";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

      - name: Block merge if issues were found
        if: always()
        env:
          CODEX_OUTPUT: ${{ steps.run_codex.outputs.final-message }}
        run: |
          output="$CODEX_OUTPUT"
          if echo "$output" | grep -qi "No issues found"; then
            echo "✅ No naming convention issues found. Good to merge."
            exit 0
          else
            echo "❌ Naming convention issues found (or the review step failed). Blocking merge."
            exit 1
          fi
